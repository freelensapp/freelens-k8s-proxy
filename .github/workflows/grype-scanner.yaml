name: Grype Scanner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: 38 20 * * *
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: Grype scan

    runs-on: ubuntu-24.04-arm

    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      # Renovate keeps this version up to date via the inline datasource hint
      # below (see .renovaterc.json5 customManagers).
      GRYPE_VERSION: v0.116.0 # datasource=github-releases depName=anchore/grype

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      # A single Go binary has one dependency set regardless of target
      # OS/arch, so scanning go.mod/go.sum directly (no build, no per-arch
      # matrix) is enough to catch all vulnerable modules. json is produced
      # alongside sarif because post-scan-report needs fields sarif does not
      # carry: component type, installed/fixed-in versions and risk score.
      - name: Scan source with Grype
        run: |
          set -eo pipefail
          "${{ steps.grype.outputs.cmd }}" dir:. -o sarif=grype.sarif -o json=grype.json

      - name: Upload Grype SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype.sarif
          category: grype

      - name: Upload vulnerability report
        if: github.ref_name == 'main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: "${{ github.event.repository.name }}-grype.json"
          path: grype.json

  post-scan-report:
    name: post scan report to discussion

    # Turns the Grype JSON report from the scan job into a markdown table and
    # replaces the tracking discussion's body with it, so the discussion
    # always reflects the latest main-branch scan. Runs for the real branch
    # build (push/dispatch on main) only, never for PRs.
    if: github.ref_name == 'main' && github.event_name != 'pull_request'

    needs:
      - scan

    runs-on: ubuntu-24.04-arm

    permissions:
      actions: read
      discussions: write

    env:
      DISCUSSION_NUMBER: 179

    steps:
      - name: Download vulnerability report
        uses: actions/download-artifact@v8
        with:
          name: "${{ github.event.repository.name }}-grype.json"

      - name: Build vulnerability table
        run: |
          set -eo pipefail
          # Flatten each match into a table row. severity/risk/type/installed
          # version/fixed-in version come straight from grype's JSON fields
          # (mirroring its own default table columns); the advisory link uses
          # vulnerability.dataSource. negrisk is a sort-only helper: yq has no
          # unary minus, so descending-by-risk needs the value pre-negated.
          yq -pj -oj '
            ({"Critical":0,"High":1,"Medium":2,"Low":3,"Negligible":4,"Unknown":5}) as $rank
            | (.matches // [])
            | map(
                {
                  "severity": .vulnerability.severity,
                  "risk": (.vulnerability.risk // 0),
                  "package": .artifact.name,
                  "type": .artifact.type,
                  "installed": .artifact.version,
                  "fixed": ((.vulnerability.fix.versions // []) | join(", ")),
                  "advisory": ("[" + .vulnerability.id + "](" + (.vulnerability.dataSource // "") + ")"),
                  "location": (.artifact.locations[0].path // ""),
                  "rank": ($rank[.vulnerability.severity] // 9),
                  "negrisk": (0 - (.vulnerability.risk // 0))
                }
              )
            | sort_by(.rank, .negrisk, .package)
            | map(del(.rank) | del(.negrisk))
          ' grype.json > rows.json
          count=$(yq -pj -oj 'length' rows.json)
          {
            echo "Grype vulnerability scan for [\`${GITHUB_SHA:0:12}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), updated $(date -u +'%Y-%m-%d %H:%M UTC') by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            if [[ "$count" -eq 0 ]]; then
              echo "No vulnerabilities found."
            else
              echo "| Severity | Risk | Package | Type | Installed | Fixed In | Advisory | Location |"
              echo "| --- | --- | --- | --- | --- | --- | --- | --- |"
              # LC_ALL=C: printf "%.1f" must use a period regardless of the
              # runner's locale, or it silently truncates "6.6" to "6" (parsed
              # up to the first non-digit) and re-renders it as "6,0".
              yq -pj -ot rows.json | tail -n +2 |
                LC_ALL=C awk -F'\t' '{printf "| %s | %.1f | %s | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6, $7, $8}'
            fi
          } > body.md
          echo "vulnerabilities: $count"

      - name: Update discussion
        run: |
          set -eo pipefail
          discussion_id=$(gh api graphql -f query='
            query($owner:String!,$repo:String!,$num:Int!){
              repository(owner:$owner,name:$repo){
                discussion(number:$num){ id }
              }
            }' -f owner="${{ github.repository_owner }}" -f repo="${{ github.event.repository.name }}" -F num="$DISCUSSION_NUMBER" \
            --jq '.data.repository.discussion.id')
          if [[ -z "$discussion_id" || "$discussion_id" == "null" ]]; then
            echo "Discussion #$DISCUSSION_NUMBER not found" >&2
            exit 1
          fi
          gh api graphql -f query='
            mutation($id:ID!,$body:String!){
              updateDiscussion(input:{discussionId:$id, body:$body}){
                discussion{ id }
              }
            }' -f id="$discussion_id" -F body=@body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
