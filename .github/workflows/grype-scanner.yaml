name: Grype Scanner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: 38 20 * * *
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: Grype scan

    runs-on: ubuntu-24.04-arm

    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      # Renovate keeps this version up to date via the inline datasource hint
      # below (see .renovaterc.json5 customManagers).
      GRYPE_VERSION: v0.116.0 # datasource=github-releases depName=anchore/grype

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock.
      - name: Set up yq
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      # The source scan catalogues the Go modules from go.mod/go.sum and the
      # actions pinned in the workflow files; the binary scan below cannot see
      # the latter. json is produced alongside sarif because post-scan-report
      # needs fields sarif does not carry: component type, installed/fixed-in
      # versions and risk score.
      - name: Scan source with Grype
        run: |
          set -eo pipefail
          "${{ steps.grype.outputs.cmd }}" dir:. -o sarif=grype-source.sarif -o json=grype-source.json

      # A source scan never sees the Go stdlib: the toolchain version is
      # recorded in the compiled binary alone, so stdlib vulnerabilities
      # (net/http, crypto/x509, archive/*) stay invisible to `grype dir:.`. A
      # single Go binary has one dependency set regardless of target OS/arch,
      # so building one target is enough - no per-arch matrix.
      - name: Build binary
        run: go build -trimpath -o freelens-k8s-proxy .
        env:
          CGO_ENABLED: "0"

      - name: Scan binary with Grype
        run: |
          set -eo pipefail
          "${{ steps.grype.outputs.cmd }}" file:freelens-k8s-proxy -o sarif=grype-binary.sarif -o json=grype-binary.json
        env:
          # Grype 0.116 does match the stdlib through govulndb on its own;
          # what this flag adds are the NVD records, which are not all
          # reachable from a GO-* advisory. Measured on a go1.26.3 binary:
          # 3 matches without it, 8 with it - three of the extra ones only
          # restate a GO-* advisory under its CVE id (they carry it as a
          # related vulnerability), but the remaining two are High severity
          # and appear nowhere in the govulndb results.
          GRYPE_MATCH_GOLANG_ALWAYS_USE_CPE_FOR_STDLIB: "true"

      # Grype points the binary findings at the scanned file
      # (/freelens-k8s-proxy), an absolute path that does not exist in the
      # repository, so code scanning cannot map an alert to a source file.
      # go.mod is where both stdlib and module findings are actually fixed.
      - name: Repoint SARIF findings at go.mod
        run: |
          set -eo pipefail
          yq -pj -oj '(.runs[].results[].locations[].physicalLocation.artifactLocation.uri) = "go.mod"' \
            grype-binary.sarif > grype-binary.sarif.tmp
          mv grype-binary.sarif.tmp grype-binary.sarif

      - name: Upload source Grype SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype-source.sarif
          category: grype

      - name: Upload binary Grype SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype-binary.sarif
          category: grype-binary

      # Both scans catalogue the Go modules, so a module match appears in both
      # reports. The source report is kept as it is and only the matches the
      # binary scan adds on top of it - the stdlib ones - are appended, so
      # findings that legitimately repeat within a single scan (the same
      # action pinned in several workflows) are not collapsed.
      - name: Merge vulnerability reports
        if: github.ref_name == 'main' && github.event_name != 'pull_request'
        run: |
          set -eo pipefail
          yq -pj -oj '
            (.matches // []) as $source
            | ($source | map(.vulnerability.id + "|" + .artifact.name + "|" + .artifact.version)) as $seen
            | {
                "matches": (
                  $source
                  + (
                      (load("grype-binary.json").matches // [])
                      | map(select(
                          (.vulnerability.id + "|" + .artifact.name + "|" + .artifact.version) as $key
                          | $seen | any_c(. == $key) | not
                        ))
                    )
                )
              }
          ' grype-source.json > grype.json

      - name: Upload vulnerability report
        if: github.ref_name == 'main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: "${{ github.event.repository.name }}-grype.json"
          path: grype.json

  post-scan-report:
    name: post scan report to discussion

    # Turns the Grype JSON report from the scan job into a markdown table and
    # replaces the tracking discussion's body with it, so the discussion
    # always reflects the latest main-branch scan. Runs for the real branch
    # build (push/dispatch on main) only, never for PRs.
    if: github.ref_name == 'main' && github.event_name != 'pull_request'

    needs:
      - scan

    runs-on: ubuntu-24.04-arm

    permissions:
      actions: read
      contents: read
      discussions: write

    env:
      DISCUSSION_NUMBER: 179

    steps:
      # Only needed for mise.toml and mise.lock: this job builds the table
      # with yq and nothing else here reads the working tree.
      - name: Checkout
        uses: actions/checkout@v7

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock.
      - name: Set up yq
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Download vulnerability report
        uses: actions/download-artifact@v8
        with:
          name: "${{ github.event.repository.name }}-grype.json"

      - name: Build vulnerability table
        run: |
          set -eo pipefail
          # Flatten each match into a table row. severity/risk/type/installed
          # version/fixed-in version come straight from grype's JSON fields
          # (mirroring its own default table columns); the advisory link uses
          # vulnerability.dataSource. negrisk is a sort-only helper: yq has no
          # unary minus, so descending-by-risk needs the value pre-negated.
          yq -pj -oj '
            ({"Critical":0,"High":1,"Medium":2,"Low":3,"Negligible":4,"Unknown":5}) as $rank
            | (.matches // [])
            | map(
                {
                  "severity": .vulnerability.severity,
                  "risk": (.vulnerability.risk // 0),
                  "package": .artifact.name,
                  "type": .artifact.type,
                  "installed": .artifact.version,
                  "fixed": ((.vulnerability.fix.versions // []) | join(", ")),
                  "advisory": ("[" + .vulnerability.id + "](" + (.vulnerability.dataSource // "") + ")"),
                  "location": (.artifact.locations[0].path // ""),
                  "rank": ($rank[.vulnerability.severity] // 9),
                  "negrisk": (0 - (.vulnerability.risk // 0))
                }
              )
            | sort_by(.rank, .negrisk, .package)
            | map(del(.rank) | del(.negrisk))
          ' grype.json > rows.json
          count=$(yq -pj -oj 'length' rows.json)
          {
            echo "Grype vulnerability scan for [\`${GITHUB_SHA:0:12}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), updated $(date -u +'%Y-%m-%d %H:%M UTC') by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            if [[ "$count" -eq 0 ]]; then
              echo "No vulnerabilities found."
            else
              echo "| Severity | Risk | Package | Type | Installed | Fixed In | Advisory | Location |"
              echo "| --- | --- | --- | --- | --- | --- | --- | --- |"
              # LC_ALL=C: printf "%.1f" must use a period regardless of the
              # runner's locale, or it silently truncates "6.6" to "6" (parsed
              # up to the first non-digit) and re-renders it as "6,0".
              yq -pj -ot rows.json | tail -n +2 |
                LC_ALL=C awk -F'\t' '{printf "| %s | %.1f | %s | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6, $7, $8}'
            fi
          } > body.md
          echo "vulnerabilities: $count"

      - name: Update discussion
        run: |
          set -eo pipefail
          discussion_id=$(gh api graphql -f query='
            query($owner:String!,$repo:String!,$num:Int!){
              repository(owner:$owner,name:$repo){
                discussion(number:$num){ id }
              }
            }' -f owner="${{ github.repository_owner }}" -f repo="${{ github.event.repository.name }}" -F num="$DISCUSSION_NUMBER" \
            --jq '.data.repository.discussion.id')
          if [[ -z "$discussion_id" || "$discussion_id" == "null" ]]; then
            echo "Discussion #$DISCUSSION_NUMBER not found" >&2
            exit 1
          fi
          gh api graphql -f query='
            mutation($id:ID!,$body:String!){
              updateDiscussion(input:{discussionId:$id, body:$body}){
                discussion{ id }
              }
            }' -f id="$discussion_id" -F body=@body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
