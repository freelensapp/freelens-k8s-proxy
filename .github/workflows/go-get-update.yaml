name: Automated go get update

on:
  issue_comment:
    types:
      - created
  push:
    branches:
      - main
    paths:
      - go.mod
      - go.sum
  schedule:
    - cron: 58 4 * * *
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  go-get-update:
    name: go get update

    runs-on: ubuntu-26.04-arm
    environment: automated

    if: >-
      github.event_name != 'issue_comment' || (startsWith(github.event.issue.title, 'Automated go get update') && contains(github.event.comment.body,
      '/rerun') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      # author_association in the job condition is only a cheap pre-filter:
      # MEMBER and COLLABORATOR do not imply write access. The permission API
      # reports maintain as write and triage as read, and a failed lookup
      # fails the job, so an unknown permission never passes.
      - name: Require write access
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          PERMISSION=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENTER}/permission" --jq '.permission')
          echo "Permission of ${COMMENTER}: ${PERMISSION}"
          case "$PERMISSION" in
            admin|write) ;;
            *)
              echo "::error::${COMMENTER} needs write access to the repository to run this workflow"
              exit 1
              ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go get update
        run: |
          # kube-openapi has no releases and moves in lockstep with the k8s.io
          # modules, which pin one of its commits; its master can already need
          # what the pinned k8s.io release does not build with. Hold it at the
          # version the k8s.io modules select, so only a k8s bump moves it.
          KUBE_OPENAPI=$(go list -m -f '{{.Version}}' k8s.io/kube-openapi)
          go get -u . "k8s.io/kube-openapi@$KUBE_OPENAPI" 2>&1 | tee .github/update.log
          if [[ -s .github/update.log ]]; then
            go mod tidy -v 2>&1 | tee -a .github/update.log
          fi
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/^go: /- /' .github/update.log | grep -v "^- downloading " > .github/pr_body.log || true

      - name: Check for changes
        run: |
          if git diff --exit-code; then
            echo "changes=false" >> $GITHUB_ENV
          else
            echo "changes=true" >> $GITHUB_ENV
          fi

      - name: Commit and push to branch
        if: env.changes == 'true'
        uses: EndBug/add-and-commit@v11
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          default_author: github_actions
          message: Automated go get update
          new_branch: automated/go-get-update
          fetch: false
          push: origin automated/go-get-update --set-upstream --force

      - name: Create pull request
        if: env.changes == 'true'
        run: |-
          if [[ $(gh pr view automated/go-get-update --json state --jq .state || true) != "OPEN" ]]; then
            gh pr create \
              --head automated/go-get-update \
              --title "Automated go get update" \
              --body-file .github/pr_body.log \
              --label automated
          else
            gh pr edit automated/go-get-update \
              --title "Automated go get update" \
              --body-file .github/pr_body.log
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Close pull request
        if: env.changes == 'false'
        run: gh pr list --head automated/go-get-update --json number --jq '.[].number' | xargs -rn1 gh pr close --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
