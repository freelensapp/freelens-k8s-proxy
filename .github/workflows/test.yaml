name: Test

on:
  push:
    branches-ignore:
      - automated/*
      - renovate/*
    paths-ignore:
      - .editorconfig
      - .gitignore
      - .markdownlint.yaml
      - .trunk/**
      - LICENSE
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

env:
  kind_version: 0.32.0 # datasource=github-releases depName=kubernetes-sigs/kind
  kubernetes_version: 1.37.0 # datasource=docker depName=kindest/node

jobs:
  test:
    name: Test

    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch Git tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GoReleaser and yq come from mise so that their versions have a single
      # source (mise.toml) and the downloads are verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13 # datasource=github-releases depName=jdx/mise
          install_args: goreleaser yq

      - name: Run GoReleaser
        run: goreleaser build --clean --snapshot --single-target --output freelens-k8s-proxy

      - name: Start KinD cluster (Linux)
        if: runner.os == 'Linux'
        uses: helm/kind-action@v1
        with:
          cluster_name: freelens
          version: v${{ env.kind_version }}
          node_image: kindest/node:v${{ env.kubernetes_version }}
          wait: 5m

      - name: Run binary in the background
        run: |
          ./freelens-k8s-proxy > freelens-k8s-proxy.log &
          echo $! > freelens-k8s-proxy.pid
          sleep 5
          cat freelens-k8s-proxy.log

      - name: Test the output
        run: |-
          url=http://$(grep ^starting freelens-k8s-proxy.log | sed 's/.* //')/version
          curl -fsS $url | yq -pj -oj -I0 -e '.' | grep platform
